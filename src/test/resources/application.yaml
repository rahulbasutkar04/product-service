spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.springframework.jdbc.core.JdbcTemplate: OFF
    org.springframework.jdbc.core.StatementCreatorUtils: OFF

jwt:
  secret:
    key: test-secret-key-for-jwt-unit-tests-minimum-256-bits-required-for-HS256

admin:
  register:
    secret: test-admin-register-secret
