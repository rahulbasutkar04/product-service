# Run Product Service + MySQL with: docker-compose up -d
# App: http://localhost:8081  |  Swagger: http://localhost:8081/swagger-ui.html

services:
  mysql:
    image: mysql:8
    container_name: product-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rahul
      MYSQL_DATABASE: zest_india_task
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prahul"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    image: product-service:latest
    container_name: product-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zest_india_task
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rahul
      JWT_SECRET_KEY: thisissimplesecetkeybyrahulsanjayabasutkaryesyesyesyesyeysnanankhhrhjjjddhjeke
      ADMIN_REGISTER_SECRET: mySuperSecretKey123
    depends_on:
      mysql:
        condition: service_healthy
